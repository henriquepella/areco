# Avaliação com um modelo de verdade (Claude). Só roda quando disparada à mão, porque usa
# a chave de API do dono do repositório e gera custo.
#
# Como usar: Settings → Secrets and variables → Actions → New repository secret
#   nome: LLM_API_KEY   valor: <chave da Anthropic>
# Depois: aba Actions → "Avaliação com modelo (manual)" → Run workflow.
#
# O job falha se o modelo não responder (em vez de cair em silêncio no modo extrativo).
# Diagnóstico e métricas também saem como anotações na página da execução; nenhuma delas
# contém a chave nem o corpo das respostas de erro.
name: Avaliação com modelo (manual)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo da Anthropic"
        required: false
        default: "claude-opus-5-5"

jobs:
  llm-eval:
    name: Avaliação e interações com o modelo
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ inputs.model }}
    defaults:
      run:
        shell: bash  # -eo pipefail: o código de saída do python não se perde no `tee`
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Verificar a chave
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Crie o secret LLM_API_KEY em Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Testar a conexão com o modelo
        run: python -m tests.eval.diagnosticar_modelo

      - name: Avaliação do pacote + casos do desenvolvedor (com modelo)
        run: |
          { echo '### Avaliação (pacote + desenvolvedor), modelo: '"$LLM_MODEL"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m tests.eval.run_eval --save --exigir-modelo | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Avaliação da validação separada (com modelo)
        run: |
          { echo '### Validação separada (nunca usada para ajuste)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m tests.eval.run_eval --validacao --save --exigir-modelo | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Interações reais pela API (registro em JSON Lines)
        run: |
          INTERACTION_LOG_PATH="$PWD/interacoes_llm.jsonl" uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          python -m tests.eval.simular_interacoes --url http://localhost:8000
          python - <<'EOF'
          import collections, json
          rows = [json.loads(line) for line in open("interacoes_llm.jsonl", encoding="utf-8")]
          modes = dict(collections.Counter(r.get("mode") for r in rows))
          notices = sum(1 for r in rows if r.get("notice"))
          print(f"::notice title=Interações pela API::{len(rows)} interações; modos {modes}; avisos {notices}")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-com-modelo
          path: |
            backend/tests/eval/resultados_*.json
            backend/interacoes_llm.jsonl
